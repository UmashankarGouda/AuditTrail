version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: audittrail-postgres
    environment:
      POSTGRES_DB: audittrail_db
      POSTGRES_USER: audittrail_user
      POSTGRES_PASSWORD: AuditTrail123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audittrail_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - audittrail-network

  backend:
    build: .
    container_name: audittrail-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/audittrail_db
      SPRING_DATASOURCE_USERNAME: audittrail_user
      SPRING_DATASOURCE_PASSWORD: AuditTrail123!
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8081
      SERVER_SERVLET_CONTEXT_PATH: /audittrail
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - audittrail-network

  frontend:
    build: ./frontend
    container_name: audittrail-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8081/audittrail/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - audittrail-network

volumes:
  postgres_data:

networks:
  audittrail-network:
    driver: bridge
